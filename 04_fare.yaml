openapi: 3.0.3
info:
  title: Ride Booking API - Fare
  description: API specification for the ride booking system.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Authentication
- name: Driver
- name: Dispatch
- name: Fare
- name: Booking
- name: Payment
- name: Notification
- name: Rating
- name: Administration
- name: Report
paths:
  /fares/estimate:
    post:
      tags:
      - Fare
      summary: Tính giá cước dự kiến
      description: 'FR-11: Xác định giá cước dự kiến dựa trên thông tin chuyến đi
        và hiển thị cho khách hàng.'
      operationId: fr_11_tinh_gia_cuoc
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimated_fare:
                    type: number
                    example: 85000
                  currency:
                    type: string
                    example: VND
        '400':
          description: Dữ liệu chuyến đi không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pickup
              - destination
              - vehicle_type
              properties:
                pickup:
                  type: string
                  example: 123 Nguyen Hue, District 1
                destination:
                  type: string
                  example: Tan Son Nhat Airport
                vehicle_type:
                  type: string
                  enum:
                  - CabBike
                  - CabCar4
                  - CabCar7
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu không hợp lệ
        details:
          type: object
          additionalProperties: true
