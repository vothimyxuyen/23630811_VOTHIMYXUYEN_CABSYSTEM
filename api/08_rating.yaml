openapi: 3.0.3
info:
  title: Ride Booking API - Rating
  description: API specification for the ride booking system.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Authentication
- name: Driver
- name: Dispatch
- name: Fare
- name: Booking
- name: Payment
- name: Notification
- name: Rating
- name: Administration
- name: Report
paths:
  /trips/{tripId}/rating:
    post:
      tags:
      - Rating
      summary: Đánh giá tài xế
      description: 'FR-15: Cho phép khách hàng đánh giá tài xế sau khi hoàn thành
        chuyến và lưu điểm đánh giá cùng nhận xét nếu có.'
      operationId: fr_15_danh_gia_tai_xe
      responses:
        '201':
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating_id:
                    type: string
                    example: rating_001
                  score:
                    type: integer
                    example: 5
                  comment:
                    type: string
                    example: Tài xế thân thiện và lái xe an toàn.
        '400':
          description: Điểm đánh giá không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Chuyến chưa hoàn thành hoặc đã được đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - score
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: Tài xế thân thiện và lái xe an toàn.
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId của chuyến đi.
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu không hợp lệ
        details:
          type: object
          additionalProperties: true
