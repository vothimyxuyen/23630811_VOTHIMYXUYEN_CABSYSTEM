openapi: 3.0.3
info:
  title: Ride Booking API - Payment
  description: API specification for the ride booking system.
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
tags:
- name: Authentication
- name: Driver
- name: Dispatch
- name: Fare
- name: Booking
- name: Payment
- name: Notification
- name: Rating
- name: Administration
- name: Report
paths:
  /payments/methods:
    get:
      tags:
      - Payment
      summary: Chọn phương thức thanh toán
      description: 'FR-12: Cho phép khách hàng lựa chọn Tiền mặt hoặc Thanh toán trực
        tuyến.'
      operationId: fr_12_chon_phuong_thuc_thanh_toan
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - CASH
                      - ONLINE
                      example: CASH
                    name:
                      type: string
                      example: Tiền mặt
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /trips/{tripId}/payment:
    post:
      tags:
      - Payment
      summary: Thực hiện thanh toán
      description: 'FR-13: Ghi nhận số tiền cần thanh toán, xử lý thanh toán theo
        phương thức đã chọn và cập nhật trạng thái giao dịch.'
      operationId: fr_13_thuc_hien_thanh_toan
      responses:
        '200':
          description: Thanh toán thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_id:
                    type: string
                    example: payment_001
                  amount:
                    type: number
                    example: 85000
                  status:
                    type: string
                    enum:
                    - PENDING
                    - PAID
                    - FAILED
                    example: PAID
        '400':
          description: Dữ liệu thanh toán không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Trạng thái thanh toán không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - payment_method
              properties:
                payment_method:
                  type: string
                  enum:
                  - CASH
                  - ONLINE
                  example: ONLINE
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
        description: tripId của chuyến đi.
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu không hợp lệ
        details:
          type: object
          additionalProperties: true
