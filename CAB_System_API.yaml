openapi: 3.0.3
info:
  title: CAB System API
  description: OpenAPI specification cho CAB System. Mỗi Functional Requirement (FR-01
    đến FR-42) được ánh xạ thành đúng một API operation. Các endpoint là thiết kế
    REST đề xuất từ nội dung Functional Requirements.
  version: 1.0.0
  contact:
    name: CAB System Project
servers:
- url: http://localhost:3000/api/v1
  description: Local development
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Đăng ký tài khoản
      description: 'FR-01: Cho phép khách hàng đăng ký tài khoản bằng thông tin cá
        nhân; kiểm tra dữ liệu hợp lệ và không cho phép đăng ký trùng thông tin tài
        khoản.'
      operationId: fr_01_fr_01_ng_k_t_i_kho_n
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success
                  access_token:
                    type: string
                    example: eyJhbGciOi...
                  role:
                    type: string
                    example: CUSTOMER
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Dữ liệu không hợp lệ
                  details:
                    type: object
                    additionalProperties: true
        '401':
          description: Chưa xác thực hoặc không có quyền
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Dữ liệu không hợp lệ
                  details:
                    type: object
                    additionalProperties: true
        '404':
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Dữ liệu không hợp lệ
                  details:
                    type: object
                    additionalProperties: true
        '500':
          description: Lỗi máy chủ
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Dữ liệu không hợp lệ
                  details:
                    type: object
                    additionalProperties: true
        '403':
          description: Không có quyền thực hiện
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Dữ liệu không hợp lệ
                  details:
                    type: object
                    additionalProperties: true
        '409':
          description: Xung đột dữ liệu hoặc trạng thái
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Dữ liệu không hợp lệ
                  details:
                    type: object
                    additionalProperties: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - full_name
              - phone
              - password
              properties:
                full_name:
                  type: string
                  example: Nguyen Van A
                phone:
                  type: string
                  example: 0901234567
                email:
                  type: string
                  format: email
                  example: a@example.com
                password:
                  type: string
                  format: password
                  example: StrongPassword123!
      security: []
